---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    env:
      - name: TZ
        value: Asia/Novosibirsk
    ports:
      forgejo-ssh:
        port: 8022
        expose:
          default: true
        exposedPort: 22
        protocol: TCP
