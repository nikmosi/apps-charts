---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-xinfra-ru
  namespace: cert-manager
spec:
  secretName: wildcard-xinfra-ru-tls
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "monitoring,apps-zipline,apps-zot,apps-vikunja,apps-authentik,apps-ntfy"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring,apps-zipline,apps-zot,apps-vikunja,apps-authentik,apps-ntfy"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - xinfra.ru
    - "*.xinfra.ru"
