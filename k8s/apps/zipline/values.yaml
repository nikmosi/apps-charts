---
replicaCount: 1

image:
  repository: ghcr.io/diced/zipline
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: false

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: zipline.xinfra.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildcard-xinfra-ru-tls
      hosts:
        - zipline.xinfra.ru

zipline:
  env:
    CORE_HOSTNAME: "0.0.0.0"
    CORE_PORT: "3000"
    CORE_RETURN_HTTPS_URLS: "true"
    DATASOURCE_LOCAL_DIRECTORY: /zipline/uploads
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

postgresql:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: zipline
    database: zipline
    passwordKey: POSTGRESQL_PASSWORD
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

secrets:
  existingSecret: ""
  coreSecretKey: CORE_SECRET

persistence:
  storageClassName: local-path
  uploads:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  public:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  themes:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  postgresql:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

livenessProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
