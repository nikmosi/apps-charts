---
schedule: "0 2 * * *"
backoffLimit: 2
activeDeadlineSeconds: 7200

config:
  source:
    gitea:
      - token_file: /etc/gickup/secrets/forgejo-token
        user: nikmosi
        url: https://git.xinfra.ru
        ssh: true
        sshkey: /etc/gickup/secrets/ssh-key
  destination:
    gitea:
      - token_file: /etc/gickup/secrets/codeberg-token
        user: nikmosi
        url: https://codeberg.org
        mirror:
          enabled: true
        visibility:
          repositories: private

image:
  repository: buddyspencer/gickup
  pullPolicy: IfNotPresent
  tag: "0.10.45"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

existingSecret: gickup-secrets

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
