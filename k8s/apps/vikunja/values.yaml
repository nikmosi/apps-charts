---
vikunja:
  image:
    tag: "2.3.0"
  env:
    TZ: Asia/Novosibirsk
  configMaps:
    config:
      enabled: false
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      memory: 192Mi
  persistence:
    config:
      enabled: true
      type: secret
      name: vikunja-config
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 10Gi
      mountPath: /app/vikunja/files
  ingress:
    main:
      enabled: true
      hosts:
        - host: vikunja.xinfra.ru
          paths:
            - path: /
      tls:
        - hosts:
            - vikunja.xinfra.ru
          secretName: wildcard-xinfra-ru-tls
