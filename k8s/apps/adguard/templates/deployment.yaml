---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adguard.fullname" . | quote }}
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "adguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adguard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "adguard.serviceAccountName" . | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.adguardConfig .Values.persistence.enabled }}
      initContainers:
        - name: init-config
          image: {{ include "adguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              if [ ! -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
                cp /opt/adguardhome/conf.init/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
                echo "Initial config applied"
              else
                echo "Config already exists, skipping"
              fi
          volumeMounts:
            - name: init-config
              mountPath: /opt/adguardhome/conf.init
              readOnly: true
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
      {{- end }}
      containers:
        - name: adguard
          image: {{ include "adguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: {{ .Values.service.ui.port }}
              protocol: TCP
          {{- if .Values.encryption.enabled }}
            - name: dot
              containerPort: {{ .Values.service.dns.encryptedPort }}
              protocol: TCP
            - name: doq
              containerPort: {{ .Values.service.dns.encryptedPort }}
              protocol: UDP
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.livenessProbe.enabled (omit .Values.livenessProbe "enabled") }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if and .Values.readinessProbe.enabled (omit .Values.readinessProbe "enabled") }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if .Values.encryption.enabled }}
            - name: tls
              mountPath: {{ .Values.encryption.mountPath | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if .Values.encryption.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.encryption.secretName | quote }}
      {{- end }}
      {{- if and .Values.adguardConfig .Values.persistence.enabled }}
        - name: init-config
          configMap:
            name: {{ include "adguard.fullname" . }}-config
      {{- end }}
      {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
