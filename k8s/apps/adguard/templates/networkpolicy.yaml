{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "adguard.fullname" . | quote }}
  labels:
    {{- include "adguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "adguard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
