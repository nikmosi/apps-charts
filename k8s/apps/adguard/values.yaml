---
replicaCount: 1

image:
  repository: adguard/adguardhome
  tag: v0.107.76
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: adguard

revisionHistoryLimit: 3
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30

strategy:
  type: Recreate

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  dns:
    name: adguard-dns
    type: LoadBalancer
    loadBalancerIP: ""
    annotations: {}
    externalTrafficPolicy: Local
    port: 53
    encryptedPort: 853
  ui:
    name: adguard-ui
    type: ClusterIP
    port: 80
    targetPort: http

ingress:
  enabled: true
  name: adguard-ingress
  className: traefik
  annotations: {}
  hosts:
    - host: adguard.xinfra.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - adguard.xinfra.ru
      secretName: wildcard-xinfra-ru-tls

dohIngress:
  enabled: true
  name: adguard-doh-ingress
  className: traefik
  annotations: {}
  host: adguard.xinfra.ru
  path: /dns-query
  tls:
    secretName: wildcard-xinfra-ru-tls

encryption:
  enabled: true
  serverName: adguard.xinfra.ru
  secretName: wildcard-xinfra-ru-tls
  mountPath: /etc/adguardhome/tls
  certificateFile: tls.crt
  privateKeyFile: tls.key
  forceHttps: false
  strictSniCheck: false

forwardAuth:
  enabled: true
  name: forwardauth-authelia
  address: http://authelia.apps-authelia.svc.cluster.local/api/authz/forward-auth
  trustForwardHeader: true
  authResponseHeaders:
    - Remote-User
    - Remote-Name
    - Remote-Email
    - Remote-Groups

env:
  - name: TZ
    value: Asia/Novosibirsk

persistence:
  enabled: true
  claimName: adguard-data
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 2Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
