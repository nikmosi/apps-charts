---
replicaCount: 1

image:
  repository: adguard/adguardhome
  tag: v0.107.76
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: adguard

revisionHistoryLimit: 3
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 30

strategy:
  type: Recreate

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

service:
  dns:
    name: adguard-dns
    type: LoadBalancer
    loadBalancerIP: ""
    annotations: {}
    externalTrafficPolicy: Local
    port: 53
    encryptedPort: 853
  ui:
    name: adguard-ui
    type: ClusterIP
    port: 80
    targetPort: http

ingress:
  enabled: true
  name: adguard-ingress
  className: traefik
  annotations: {}
  hosts:
    - host: adguard.xinfra.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - adguard.xinfra.ru
      secretName: wildcard-xinfra-ru-tls

dohIngress:
  enabled: true
  name: adguard-doh-ingress
  className: traefik
  annotations: {}
  host: adguard.xinfra.ru
  path: /dns-query
  tls:
    secretName: wildcard-xinfra-ru-tls

encryption:
  enabled: true
  serverName: adguard.xinfra.ru
  secretName: wildcard-xinfra-ru-tls
  mountPath: /etc/adguardhome/tls
  certificateFile: tls.crt
  privateKeyFile: tls.key
  forceHttps: false
  strictSniCheck: false

forwardAuth:
  enabled: false
  name: ""
  address: ""
  trustForwardHeader: false
  authResponseHeaders: []

adguardConfig:
  # Initial AdGuardHome configuration (applied on first start)
  dns:
    upstream_dns:
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
      - https://dns10.quad9.net/dns-query
    bootstrap_dns:
      - 1.1.1.1
      - 8.8.8.8
      - 1.0.0.1
      - 8.8.4.4
      - 9.9.9.10
      - 149.112.112.10
    upstream_mode: load_balance
    cache_enabled: true
    cache_size: 4194304
    enable_dnssec: true
    refuse_any: true
    serve_plain_dns: true
    filtering_enabled: true
    protection_enabled: true
    rate_limit: 20

env:
  - name: TZ
    value: Asia/Novosibirsk

persistence:
  enabled: true
  claimName: adguard-data
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 2Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

livenessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
