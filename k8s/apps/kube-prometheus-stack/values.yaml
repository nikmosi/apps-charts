---
fullnameOverride: kube-prometheus-stack

crds:
  enabled: true
  upgradeJob:
    enabled: true
    forceConflicts: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

alertmanager:
  enabled: true
  ingress:
    enabled: false
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Novosibirsk

  adminUser: admin

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.xinfra.ru
    path: /
    tls:
      - hosts:
          - grafana.xinfra.ru
        secretName: wildcard-xinfra-ru-tls

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  grafana.ini:
    server:
      domain: grafana.xinfra.ru
      root_url: https://grafana.xinfra.ru
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      disable_gravatar: true
    users:
      allow_sign_up: false
      auto_assign_org_role: Viewer
    auth.anonymous:
      enabled: false

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      uid: prometheus
      alertmanager:
        enabled: true
        uid: alertmanager
        handleGrafanaManagedAlerts: false
        implementation: prometheus

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

kubeApiServer:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  releaseLabel: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

nodeExporter:
  enabled: true

prometheus-node-exporter:
  releaseLabel: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

prometheus:
  enabled: true
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    shards: 1
    scrapeInterval: 30s
    scrapeTimeout: 10s
    evaluationInterval: 30s
    retention: 15d
    retentionSize: 18GiB
    walCompression: true

    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}

    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeConfigSelector: {}
    scrapeConfigNamespaceSelector: {}

    resources:
      requests:
        cpu: 150m
        memory: 768Mi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

thanosRuler:
  enabled: false
