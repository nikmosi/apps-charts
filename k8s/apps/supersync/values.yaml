---
replicaCount: 1

image:
  repository: iari/supersync
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

revisionHistoryLimit: 3
progressDeadlineSeconds: 600
terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

service:
  type: ClusterIP
  port: 1900
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: supersync.xinfra.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildcard-xinfra-ru-tls
      hosts:
        - supersync.xinfra.ru

config:
  host: "0.0.0.0"
  publicUrl: ""
  corsEnabled: true
  corsOrigins: "https://app.super-productivity.com,https://*.super-productivity-preview.pages.dev"
  runMigrationsOnStartup: true
  webauthnRpName: "Super Productivity Sync"
  webauthnRpId: ""
  webauthnOrigin: ""
  oldOpsCleanupDeleteBatchSize: 5000
  oldOpsCleanupMaxDeletedPerRun: 25000
  supersyncBatchUpload: false
  supersyncPayloadBytesBackfillComplete: false
  smtpHost: ""
  smtpPort: 587
  smtpSecure: false
  smtpFrom: ""
  extraConfig: {}

secret:
  jwtSecret: ""
  databaseUrl: ""
  smtpUser: ""
  smtpPass: ""
  existingSecret: ""

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

networkPolicy:
  enabled: false
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}
  metricRelabelings: []
  relabelings: []

env: []
extraEnv:
  - name: TZ
    value: "Asia/Novosibirsk"

nodeSelector: {}
tolerations: []
affinity: {}

postgresql:
  enabled: true
  image:
    registry: registry-1.docker.io
    repository: bitnami/postgresql
    tag: sha256-7eaa445b1045a7a5665ce274f1c5376bd24c938df01453618d3fda12a3d6baad
    pullPolicy: IfNotPresent
  auth:
    username: supersync
    password: ""
    database: supersync
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 8Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  metrics:
    enabled: false
