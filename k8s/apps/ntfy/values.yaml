---
replicaCount: 1

image:
  repository: binwiederhier/ntfy
  pullPolicy: IfNotPresent
  tag: "v2.22.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}
  annotations: {}
  metricRelabelings: []
  relabelings: []

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: ntfy.xinfra.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildcard-xinfra-ru-tls
      hosts:
        - ntfy.xinfra.ru
  authentik:
    enabled: false
    middlewareName: ""
    address: http://authelia.apps-authelia.svc.cluster.local/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Name
      - Remote-Email
      - Remote-Groups
    outpost:
      enabled: true
      routeNamespace: apps-authentik
      host: ntfy.xinfra.ru
      pathPrefix: /outpost.goauthentik.io
      serviceName: authentik-server
      serviceNamespace: apps-authentik
      servicePort: 80
      entryPoints:
        - websecure
      tls:
        secretName: wildcard-xinfra-ru-tls
      priority: 2000

topicBypass:
  # Routes matching these topic prefixes bypass authentik and rely on ntfy native auth.
  enabled: true
  entryPoints:
    - websecure
  tls:
    secretName: wildcard-xinfra-ru-tls
  prefixes:
    - alerts-
  priority: 1000

ntfy:
  # ntfy.config is rendered as /etc/ntfy/server.yml.
  config:
    base-url: https://ntfy.xinfra.ru
    listen-http: ":8080"
    enable-metrics: true
    cache-file: /var/cache/ntfy/cache.db
    auth-file: /var/cache/ntfy/user.db
    auth-default-access: deny-all

  # ntfy.extraArgs are appended after `ntfy serve`.
  extraArgs: []

  # ntfy.extraEnv adds additional environment variables to the ntfy container.
  extraEnv:
    - name: TZ
      value: "Asia/Novosibirsk"

persistence:
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 1Gi

resources: {}

livenessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /v1/health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
