{{- if and (not .Values.rabbitmq.enabled) (not .Values.eventBus.rabbitmq.externalUrl) (not .Values.eventBus.rabbitmq.externalUrlSecret.name) -}}
{{- fail "Set eventBus.rabbitmq.externalUrl or eventBus.rabbitmq.externalUrlSecret.name when rabbitmq.enabled=false" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "twitch-sub-check.fullname" . }}
  labels:
    {{- include "twitch-sub-check.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "twitch-sub-check.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twitch-sub-check.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "twitch-sub-check.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "twitch-sub-check.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.command | nindent 12 }}
            - "--interval"
            - {{ .Values.watch.interval | quote }}
          env:
            - name: TWITCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.credentialsSecretName" . }}
                  key: {{ .Values.credentials.secretKeys.twitchClientId | quote }}
            - name: TWITCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.credentialsSecretName" . }}
                  key: {{ .Values.credentials.secretKeys.twitchClientSecret | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.credentialsSecretName" . }}
                  key: {{ .Values.credentials.secretKeys.telegramBotToken | quote }}
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.credentialsSecretName" . }}
                  key: {{ .Values.credentials.secretKeys.telegramChatId | quote }}
            - name: DB_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: DB_ECHO
              value: {{ .Values.config.databaseEcho | quote }}
            - name: REPORT_CRON
              value: {{ .Values.config.reportCron | quote }}
            - name: RABBITMQ_EXCHANGE
              value: {{ .Values.config.rabbitmqExchange | quote }}
            - name: RABBITMQ_QUEUE
              value: {{ .Values.config.rabbitmqQueue | quote }}
            - name: RABBITMQ_PREFETCH
              value: {{ .Values.config.rabbitmqPrefetch | quote }}
            {{- if .Values.eventBus.rabbitmq.externalUrlSecret.name }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventBus.rabbitmq.externalUrlSecret.name | quote }}
                  key: {{ .Values.eventBus.rabbitmq.externalUrlSecret.key | quote }}
            {{- else if .Values.eventBus.rabbitmq.externalUrl }}
            - name: RABBITMQ_URL
              value: {{ .Values.eventBus.rabbitmq.externalUrl | quote }}
            {{- else }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.rabbitmqSecretName" . }}
                  key: {{ .Values.rabbitmq.auth.secretKeys.username | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.rabbitmqSecretName" . }}
                  key: {{ .Values.rabbitmq.auth.secretKeys.password | quote }}
            - name: RABBITMQ_URL
              value: {{ printf "amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@%s:%d/" (include "twitch-sub-check.rabbitmqFullname" .) (int .Values.rabbitmq.service.port) | quote }}
            {{- end }}
            - name: PYTHONUNBUFFERED
              value: {{ .Values.config.pythonUnbuffered | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: {{ .Values.config.pythonDontWriteBytecode | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - grep -qa 'src/main.py' /proc/1/cmdline
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - grep -qa 'src/main.py' /proc/1/cmdline
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/var
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "twitch-sub-check.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit | quote }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
