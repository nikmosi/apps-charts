{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "twitch-sub-check.fullname" . }}
  labels:
    {{- include "twitch-sub-check.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "twitch-sub-check.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    {{- if .Values.networkPolicy.ingress }}
    - Ingress
    {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- if .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- end }}
{{- end }}
