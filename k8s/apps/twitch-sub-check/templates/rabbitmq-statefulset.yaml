{{- if .Values.rabbitmq.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "twitch-sub-check.rabbitmqFullname" . }}
  labels:
    {{- include "twitch-sub-check.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ include "twitch-sub-check.rabbitmqFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "twitch-sub-check.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "twitch-sub-check.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.rabbitmq.podSecurityContext | nindent 8 }}
      containers:
        - name: rabbitmq
          image: {{ include "twitch-sub-check.rabbitmqImage" . | quote }}
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.rabbitmqSecretName" . }}
                  key: {{ .Values.rabbitmq.auth.secretKeys.username | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "twitch-sub-check.rabbitmqSecretName" . }}
                  key: {{ .Values.rabbitmq.auth.secretKeys.password | quote }}
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: {{ .Values.rabbitmq.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.rabbitmq.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.rabbitmq.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.rabbitmq.readinessProbe.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: {{ .Values.rabbitmq.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.rabbitmq.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.rabbitmq.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.rabbitmq.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.rabbitmq.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      {{- if or (not .Values.rabbitmq.persistence.enabled) .Values.rabbitmq.persistence.existingClaim }}
      volumes:
        - name: data
          {{- if .Values.rabbitmq.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.rabbitmq.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
  {{- if and .Values.rabbitmq.persistence.enabled (not .Values.rabbitmq.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "twitch-sub-check.labels" . | nindent 10 }}
          app.kubernetes.io/component: rabbitmq
        {{- with .Values.rabbitmq.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.rabbitmq.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size | quote }}
        {{- if .Values.rabbitmq.persistence.storageClass }}
        storageClassName: {{ .Values.rabbitmq.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}
