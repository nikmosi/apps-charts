{{- if .Values.forwardAuth.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.forwardAuth.name | quote }}
  labels:
    {{- include "dozzle.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.forwardAuth.address | quote }}
    trustForwardHeader: {{ .Values.forwardAuth.trustForwardHeader }}
    authResponseHeaders:
      {{- toYaml .Values.forwardAuth.authResponseHeaders | nindent 6 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name | quote }}
  labels:
    {{- include "dozzle.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.forwardAuth.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace .Values.forwardAuth.name | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.service.name | quote }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
