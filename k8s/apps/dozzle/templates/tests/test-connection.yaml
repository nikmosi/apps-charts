---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dozzle.fullname" . }}-test-connection"
  labels:
    {{- include "dozzle.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:latest
      command:
        - wget
      args:
        - {{ printf "%s:%d" .Values.service.name (.Values.service.port | int) | quote }}
