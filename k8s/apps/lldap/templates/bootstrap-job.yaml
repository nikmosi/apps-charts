{{- if .Values.bootstrap.enabled -}}
{{- $bootstrapHash := sha256sum (toYaml .Values.bootstrap) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap-{{ $bootstrapHash | trunc 8 }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lldap-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "lldap-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        fsGroup: {{ .Values.bootstrap.securityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.bootstrap.securityContext.fsGroupChangePolicy }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}-rootless"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /work/tmp
              TMPDIR=/work/tmp /app/bootstrap.sh
          env:
            - name: LLDAP_URL
              value: http://{{ include "lldap-stack.lldapServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.http_port }}
            - name: LLDAP_ADMIN_USERNAME
              value: {{ .Values.bootstrap.adminUsername }}
            - name: LLDAP_ADMIN_PASSWORD_FILE
              value: /bootstrap/admin/{{ .Values.bootstrap.adminPasswordKey }}
            - name: GROUP_CONFIGS_DIR
              value: /bootstrap/group-configs
            - name: USER_CONFIGS_DIR
              value: /bootstrap/user-configs
            - name: USER_SCHEMAS_DIR
              value: /bootstrap/empty
            - name: GROUP_SCHEMAS_DIR
              value: /bootstrap/empty
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.bootstrap.securityContext.runAsUser }}
            runAsGroup: {{ .Values.bootstrap.securityContext.runAsGroup }}
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: group-configs
              mountPath: /bootstrap/group-configs
              readOnly: true
            - name: user-configs
              mountPath: /bootstrap/user-configs
              readOnly: true
            - name: user-passwords
              mountPath: /bootstrap/secrets
              readOnly: true
            - name: admin-password
              mountPath: /bootstrap/admin
              readOnly: true
            - name: empty-configs
              mountPath: /bootstrap/empty
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: group-configs
          configMap:
            name: {{ .Release.Name }}-bootstrap-groups
        - name: user-configs
          configMap:
            name: {{ .Release.Name }}-bootstrap-users
        - name: user-passwords
          secret:
            secretName: {{ .Values.bootstrap.userPasswordsSecret }}
        - name: admin-password
          secret:
            secretName: {{ .Values.bootstrap.adminPasswordSecret }}
            items:
              - key: {{ .Values.bootstrap.adminPasswordKey }}
                path: {{ .Values.bootstrap.adminPasswordKey }}
        - name: empty-configs
          emptyDir: {}
        - name: work
          emptyDir: {}
{{- end }}
