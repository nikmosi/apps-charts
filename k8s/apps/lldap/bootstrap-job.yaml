---
apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-bootstrap
  namespace: apps-lldap
  labels:
    app.kubernetes.io/name: lldap
    app.kubernetes.io/instance: lldap
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
        app.kubernetes.io/instance: lldap
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bootstrap
          image: ghcr.io/lldap/lldap:2026-01-06-alpine-rootless
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /work/tmp
              TMPDIR=/work/tmp /app/bootstrap.sh
          env:
            - name: LLDAP_URL
              value: http://lldap.apps-lldap.svc.cluster.local:17170
            - name: LLDAP_ADMIN_USERNAME
              value: admin
            - name: LLDAP_ADMIN_PASSWORD_FILE
              value: /bootstrap/admin/lldap-ldap-user-pass
            - name: GROUP_CONFIGS_DIR
              value: /bootstrap/group-configs
            - name: USER_CONFIGS_DIR
              value: /bootstrap/user-configs
            - name: USER_SCHEMAS_DIR
              value: /bootstrap/empty
            - name: GROUP_SCHEMAS_DIR
              value: /bootstrap/empty
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: group-configs
              mountPath: /bootstrap/group-configs
              readOnly: true
            - name: user-configs
              mountPath: /bootstrap/user-configs
              readOnly: true
            - name: user-passwords
              mountPath: /bootstrap/secrets
              readOnly: true
            - name: admin-password
              mountPath: /bootstrap/admin
              readOnly: true
            - name: empty-configs
              mountPath: /bootstrap/empty
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: group-configs
          configMap:
            name: lldap-bootstrap-groups
        - name: user-configs
          configMap:
            name: lldap-bootstrap-users
        - name: user-passwords
          secret:
            secretName: lldap-user-passwords
        - name: admin-password
          secret:
            secretName: lldap-secrets
            items:
              - key: lldap-ldap-user-pass
                path: lldap-ldap-user-pass
        - name: empty-configs
          emptyDir: {}
        - name: work
          emptyDir: {}
