{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (include "forgesync.fullname" .) .Values.secret.name }}
  labels:
    {{- include "forgesync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secret.data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
